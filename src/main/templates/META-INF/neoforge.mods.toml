modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL="https://github.com/Metallurgists-of-Create/Create-TFMG-CE/issues/"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
updateJSONURL="https://github.com/Metallurgists-of-Create/Create-TFMG-CE/raw/refs/heads/1.21.1/updates.json"
displayURL="https://github.com/Metallurgists-of-Create/Create-TFMG-CE"
logoFile="tfmg.png"
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

# Requirements
[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "create"
    type = "required"
    versionRange = "[6.0.6,)"
    ordering="AFTER"
    side = "BOTH"

# Optional/Extra compat
[[dependencies."${mod_id}"]]
    modId = "jei"
    type = "optional"
    versionRange = "[{jei_version},)"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "createbigcannons"
    type = "optional"
    versionRange = "[5.11.7,)"
    ordering="AFTER"
    side = "BOTH"

# This version onwards is permitted since it removes bug fixes
[[dependencies."${mod_id}"]]
    modId = "tfmgtweaks"
    type = "optional"
    versionRange = "[2.1.2,)"
    side = "BOTH"

# Incompatible mods
[[dependencies."${mod_id}"]]
    modId = "tfmgfixfuel"
    type = "incompatible"
    reason = "tfmgfixfuel adds mixins to fix bugs that we have already fixed ourselves."
    ordering="AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "warvior_tfmg_pondus_fix"
    type = "incompatible"
    reason = "warvior_tfmg_pondus_fix adds mixins to fix bugs that we have already fixed ourselves."
    ordering="AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "tfmgelectricalfix"
    type = "incompatible"
    reason = "tfmgelectricalfix adds mixins to fix bugs that we have already fixed ourselves."
    ordering="AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "plastic_fix"
    type = "incompatible"
    reason = "plastic_fix is not needed anymore as the plastic sheet recipe has been fixed."
    ordering="AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "fix_tfmgcontroller"
    type = "incompatible"
    reason = "fix_tfmgcontroller is not needed anymore as the engine controller does not exist anymore."
    ordering="AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "sable_weighted_tfmg"
    type = "incompatible"
    reason = "sable_weighted_tfmg is not needed anymore as TFMG: CE now uses it's own weights."
    ordering="AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "tfmg_liquid_fuel_compat"
    type = "incompatible"
    reason = "tfmg_liquid_fuel_compat is not needed anymore TFMG: CE now uses it's own fuel maps."
    ordering="AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "tfmg_patch"
    type = "incompatible"
    reason = "tfmg_patch adds mixins to fix bugs that we have already fixed ourselves."
    ordering="AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "tfmgfix"
    type = "incompatible"
    reason = "tfmgfix adds mixins to fix bugs that we have already fixed ourselves."
    ordering="AFTER"
    side = "BOTH"
#[[dependencies."${mod_id}"]]
#    modId = "cmparallelpipes"
#    type = "discouraged"
#    reason = "TFMG contains Pipe Locking via the Screwdriver that behaves funtionally identical to Create More: Parallel Pipes"
#    side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "steamsteel_tank_compat"
type = "incompatible"
reason = "steamsteel_tank_compat injects boiler data into tanks which cannot be boilers, potentially breaking some features."
ordering="AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "tfmg_vat_processing_fix"
type = "incompatible"
reason = "tfmg_vat_processing_fix attempts to modify recipe processing in an older version of the Vat block entity which has been updated."
ordering="AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "tfmg_mixer_blade_fix"
type = "incompatible"
reason = "tfmg_mixer_blade_fix is not needed as Industrial Mixers now properly store mixer items."
ordering="AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "tfmg_engine_drops_fix"
type = "incompatible"
reason = "tfmg_engine_drops_fix is not needed as Engines now properly drop all assembly components."
ordering="AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "tfmg_casting_capacity"
type = "incompatible"
reason = "tfmg_casting_capacity is not needed as Casting Basins can reasonably produce all recipes."
ordering="AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "tfmg_casting_fluid_fix"
type = "incompatible"
reason = "tfmg_casting_fluid_fix is not needed as Casting Basins now drain the appropriate amount."
ordering="AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "tfmg_winding_fix"
type = "incompatible"
reason = "tfmg_winding_fix is not needed as Winding Machines now check for the component before retrieving it."
ordering="AFTER"
side = "BOTH"
