name: CI & Deployment

on:
  workflow_run:
    workflows: [ "Build" ]
    types: [ completed ]
    branches: [ "1.21.1" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download build number from triggering run
        id: download_buildnum
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: build-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build number
        id: buildnum
        run: |
          if [ -f build_number.txt ]; then
            echo "build_number=$(cat build_number.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "build_number=${{ vars.BUILD_NUMBER }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Snapshots Maven
        env:
          KRYSTAL_MAVEN_USER: ${{ secrets.KRYSTAL_MAVEN_USER }}
          KRYSTAL_MAVEN_PASSWORD: ${{ secrets.KRYSTAL_MAVEN_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ steps.buildnum.outputs.build_number }}
        run: ./gradlew publishMavenJavaPublicationToKrystal-snapshot-mavenRepository