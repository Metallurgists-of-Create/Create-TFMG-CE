name: CI & Deployment

on:
  workflow_run:
    workflows: [ "Build" ]
    types: [ completed ]
    branches: [ "1.21.1" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish to Snapshots Maven
        env:
          KRYSTAL_MAVEN_USER: ${{ secrets.KRYSTAL_MAVEN_USER }}
          KRYSTAL_MAVEN_PASSWORD: ${{ secrets.KRYSTAL_MAVEN_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ vars.BUILD_NUMBER }}
        run: ./gradlew publishMavenJavaPublicationToKrystal-snapshot-mavenRepository