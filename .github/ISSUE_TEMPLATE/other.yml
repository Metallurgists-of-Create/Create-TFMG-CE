name: Custom / Other
description: "TFMG: CE Other"
title: "[Other]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for questions, compatibility issues, documentation problems, or anything
        else about TFMG: CE that doesn't fit the other templates.

  - type: input
    id: mod-version
    attributes:
      label: TFMG:CE Version / Build
      description: If relevant, the exact version or build number of TFMG:CE.
      placeholder: e.g. 1.4.2 or build #217
    validations:
      required: false

  - type: input
    id: log
    attributes:
      label: Log (mclo.gs link)
      description: >
        If relevant, upload your latest.log to https://mclo.gs and paste the link here.
        Do NOT paste raw logs directly into this issue.
      placeholder: https://mclo.gs/xxxxxxx
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what's going on in as much detail as possible.
    validations:
      required: true