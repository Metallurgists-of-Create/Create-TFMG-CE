name: Mod Crash Report
description: "TFMG: CE Crash Report"
title: "[Crash]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a crash caused by TFMG: CE.

  - type: input
    id: mod-version
    attributes:
      label: TFMG:CE Version / Build
      description: "The exact version or build number of TFMG: CE you were using when it crashed."
      placeholder: e.g. 1.2.4 or build #190
    validations:
      required: true

  - type: input
    id: log
    attributes:
      label: Crash Log (mclo.gs link)
      description: >
        Upload your crash report or latest.log to https://mclo.gs and paste the link here.
        Do NOT paste raw logs directly into this issue.
      placeholder: https://mclo.gs/xxxxxxx
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What were you doing when it crashed?
      description: Describe what was happening in-game right before the crash.
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other Mods Installed
      description: List other mods installed, or link a modlist/pack if applicable.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this crash hasn't already been reported.
          required: true