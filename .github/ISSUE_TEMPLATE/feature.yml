name: Feature Request
description: "TFMG: CE Feature Request"
title: "[Feature]: "
labels: ["enhancement", "suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea, enhancement, or new feature for TFMG: CE.

  - type: input
    id: mod-version
    attributes:
      label: TFMG:CE Version / Build
      description: The version you're currently using, if relevant to the request.
      placeholder: e.g. 1.2.4 or build #190
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is your request related to a problem or limitation you've run into?
    validations:
      required: false

  - type: textarea
    id: feature
    attributes:
      label: Describe the Feature
      description: A clear description of what you'd like added or changed.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions, workarounds, or existing mods that do something similar.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, mockups, or references that help explain the idea.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this hasn't already been requested.
          required: true