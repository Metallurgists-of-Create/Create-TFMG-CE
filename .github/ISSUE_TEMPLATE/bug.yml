name: Bug Report
description: Report something that isn't working correctly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Report a bug with TFMG: CE"

  - type: input
    id: mod-version
    attributes:
      label: TFMG:CE Version / Build
      description: The exact version or build number of TFMG:CE you're using.
      placeholder: e.g. 1.2.4 or build #190
    validations:
      required: true

  - type: input
    id: log
    attributes:
      label: Log (mclo.gs link)
      description: >
        Upload your latest.log (or debug.log) to https://mclo.gs and paste the link here.
        Do NOT paste raw logs directly into this issue.
      placeholder: https://mclo.gs/xxxxxxx
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear description of what the issue is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: false

  - type: textarea
    id: other-mods
    attributes:
      label: Other Mods Installed
      description: List other mods installed, or link a modlist/pack if applicable.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this bug hasn't already been reported.
          required: true